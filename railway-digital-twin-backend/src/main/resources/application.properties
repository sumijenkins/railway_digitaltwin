# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/railway_digital_twin
spring.datasource.username=postgres
spring.datasource.password=110319

# Hibernate ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.servlet.context-path=/api

cors.allowed.origins=http://localhost:5173,http://localhost:3000

logging.level.root=INFO
logging.level.com.railway.digitaltwin=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=railway-backend
mqtt.topic=railway/sensors/#

# NB-IoT Gateway Configuration
nbiot.gateway.enabled=true
nbiot.gateway.endpoint=/api/nbiot/sensors
nbiot.gateway.protocol=HTTP