version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: railway_digital_twin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: railway_dt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔥 MQTT Broker (EN ÖNEMLİ EKLEME)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: railway_mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
  
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: railway_ai_service
    restart: unless-stopped
    ports:
      - "5000:5000"

  # pgAdmin (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: railway_digital_twin_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@railway.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools


volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: railway_digital_twin_network