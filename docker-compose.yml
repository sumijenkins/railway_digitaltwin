version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: railway_digital_twin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: railway_dt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔥 MQTT Broker (EN ÖNEMLİ EKLEME)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: railway_mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  # pgAdmin (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: railway_digital_twin_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@railway.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # 🚀 Backend Service
  backend:
    build: ./railway-digital-twin-backend
    container_name: railway_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/railway_dt
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # 🧠 AI Service (Anomaly Detection)
  ai-service:
    build: ./ai-service
    container_name: railway_ai_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production


volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: railway_digital_twin_network